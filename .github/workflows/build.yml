name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

# One run per branch at a time. A newer push cancels an older branch build, but
# runs on main wait their turn, so two releases never race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Branches in this repo build on push; pull requests only add a build for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Pinned so releases don't change Xcode and SDK when GitHub moves macos-latest.
    runs-on: macos-26
    # A full build takes about 3 minutes; GitHub's default limit is 6 hours.
    timeout-minutes: 30
    env:
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the build number and existing tags
      - name: Run tests
        run: swift test
      - name: Build app and disk image
        run: ./scripts/build-dmg.sh
      - name: Check bundle resources
        run: |
          test -s build/Unplug.app/Contents/Resources/AppIcon.icns
          test -s build/Unplug.app/Contents/Resources/Assets.car
          test -s build/Unplug.app/Contents/Resources/Unplug.help/Contents/Resources/en.lproj/search.cshelpindex
          test -s build/Unplug.app/Contents/Resources/Credits.rtf
          plutil -lint build/Unplug.app/Contents/Info.plist build/Unplug.app/Contents/Resources/PrivacyInfo.xcprivacy
      - name: Smoke-test CLI
        run: |
          ./build/Unplug.app/Contents/Helpers/unplug help
          test "$(./build/Unplug.app/Contents/Helpers/unplug --version)" = "unplug $(cat VERSION)"
          ./build/Unplug.app/Contents/Helpers/unplug list || true
      - name: Smoke-test app launch
        run: |
          test -d build/Unplug.app/Contents/Frameworks/Sparkle.framework
          find .build/artifacts -type f -name sign_update | grep -q .
          ./build/Unplug.app/Contents/MacOS/Unplug & PID=$!
          sleep 5
          kill -0 "$PID" # still running, so Sparkle and the app loaded
          kill "$PID"
      - name: Sign update and write appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes GitHub generates for the release, as HTML for the update dialog.
          # Without them the update still publishes, just with no notes.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$(tr -d '[:space:]' < VERSION)" -f target_commitish="$GITHUB_SHA" --jq .body > build/release-notes.md \
            && gh api markdown -F text=@build/release-notes.md -f mode=gfm -f context="$GITHUB_REPOSITORY" > build/release-notes.html \
            || rm -f build/release-notes.html
          ./scripts/make-appcast.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unplug-dmg
          path: build/Unplug-*.dmg
      # Bumping VERSION on main publishes a release; other pushes to main skip it.
      - name: Publish release for a new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already released"
          else
            # appcast.xml is the update feed; it exists once the Sparkle key secret is set.
            gh release create "$TAG" build/Unplug-*.dmg $(ls build/appcast.xml 2>/dev/null) --target "$GITHUB_SHA" --title "Unplug $TAG" --generate-notes
          fi
