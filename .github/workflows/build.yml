name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the build number and existing tags
      - name: Build app and disk image
        run: ./scripts/build-dmg.sh
      - name: Check app icon
        run: test -s build/Unplug.app/Contents/Resources/AppIcon.icns
      - name: Smoke-test CLI
        run: |
          ./build/Unplug.app/Contents/Helpers/unplug help
          test "$(./build/Unplug.app/Contents/Helpers/unplug --version)" = "unplug $(cat VERSION)"
          ./build/Unplug.app/Contents/Helpers/unplug list || true
      - uses: actions/upload-artifact@v5
        with:
          name: Unplug-dmg
          path: build/Unplug-*.dmg
      # Bumping VERSION on main publishes a release; other pushes to main skip it.
      - name: Publish release for a new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already released"
          else
            gh release create "$TAG" build/Unplug-*.dmg --target "$GITHUB_SHA" --title "Unplug $TAG" --generate-notes
          fi
