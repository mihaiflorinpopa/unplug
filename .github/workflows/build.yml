name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build app and disk image
        run: ./scripts/build-dmg.sh
      - name: Smoke-test CLI
        run: |
          ./build/Unplug.app/Contents/Helpers/unplug help
          ./build/Unplug.app/Contents/Helpers/unplug list || true
      - uses: actions/upload-artifact@v5
        with:
          name: Unplug-dmg
          path: build/Unplug-*.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Unplug-*.dmg --title "Unplug $GITHUB_REF_NAME" --generate-notes
