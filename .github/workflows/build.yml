name: Build

on:
  push:
  pull_request:

# Read-only by default; only the release job gets write access and the signing key
# (GitHub, "Secure use reference": least privilege for GITHUB_TOKEN).
permissions:
  contents: read

# One run per branch at a time, so two releases never race. A newer push cancels
# an older branch build. On main, a running build finishes, but a newer push
# replaces one still waiting; the release still happens, since the next run
# sees the untagged VERSION.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Branches in this repo build on push; pull requests only add a build for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Pinned so releases don't change Xcode and SDK when GitHub moves macos-latest.
    # GitHub names newer images by Xcode version; this one runs macOS 27.
    runs-on: xcode-27
    # A full build takes about 3 minutes; GitHub's default limit is 6 hours.
    timeout-minutes: 30
    outputs:
      release-tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the build number and existing tags
          persist-credentials: false # no step pushes with git
      - name: Run tests
        run: swift test
      - name: Build app and disk image
        run: ./scripts/build-dmg.sh
      - name: Check bundle resources
        run: |
          test -s build/Unplug.app/Contents/Resources/AppIcon.icns
          test -s build/Unplug.app/Contents/Resources/Assets.car
          test -s build/Unplug.app/Contents/Resources/Unplug.help/Contents/Resources/en.lproj/search.cshelpindex
          test -s build/Unplug.app/Contents/Resources/Credits.rtf
          grep -q "Andy Matuschak" "build/Unplug.app/Contents/Resources/Sparkle LICENSE.txt"
          plutil -lint build/Unplug.app/Contents/Info.plist build/Unplug.app/Contents/Resources/PrivacyInfo.xcprivacy
      - name: Check signature and SDK
        run: |
          codesign --verify --deep --strict build/Unplug.app
          # macOS gives an app the behavior of the SDK it records, so it must be the one it was built with.
          xcrun vtool -show-build build/Unplug.app/Contents/MacOS/Unplug | grep " sdk $(xcrun --show-sdk-version)$"
      - name: Check disk image
        run: |
          diskutil image attach --readOnly --nobrowse --mountPoint build/mnt build/Unplug-*.dmg
          test -d build/mnt/Unplug.app
          test -L build/mnt/Applications # drag-and-drop install
          diskutil eject build/mnt
      - name: Smoke-test CLI
        run: |
          ./build/Unplug.app/Contents/Helpers/unplug help
          test "$(./build/Unplug.app/Contents/Helpers/unplug --version)" = "unplug $(cat VERSION)"
          ./build/Unplug.app/Contents/Helpers/unplug list || true
      - name: Smoke-test app launch
        run: |
          test -d build/Unplug.app/Contents/Frameworks/Sparkle.framework
          find .build/artifacts -type f -name sign_update | grep -q .
          ./build/Unplug.app/Contents/MacOS/Unplug & PID=$!
          sleep 5
          kill -0 "$PID" # still running, so Sparkle and the app loaded
          kill "$PID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unplug-dmg
          path: build/Unplug-*.dmg
          archive: false # a .dmg is compressed already
          retention-days: 14 # releases keep their own copy
      # Bumping VERSION on main publishes a release; other pushes to main don't.
      - name: Check for a new version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already released"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
      # The release job signs this exact .dmg, and reads the build number and public key from the app.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.tag != ''
        with:
          name: release-input
          path: |
            build/Unplug-*.dmg
            build/Unplug.app/Contents/Info.plist
          retention-days: 1

  release:
    needs: build
    if: needs.build.outputs.release-tag != ''
    runs-on: xcode-27
    timeout-minutes: 30
    # The Sparkle key lives in this environment, which only main can deploy to.
    environment: release
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-input
          path: build
      - name: Fetch Sparkle's signing tools
        run: swift package resolve
      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release-tag }}
        run: |
          # The notes GitHub generates for the release (.github/release.yml leaves out
          # internal changes), as HTML for the update dialog. For the people updating, the
          # author, pull request link, version in titles and Full Changelog line go; the
          # release page keeps them. With no change left, the update has no notes.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body \
            | sed -E 's/ by @[^ ]+ in https:\/\/github\.com\/[^ ]+$//; s/, version [0-9.]+$//; /^\*\*Full Changelog\*\*/d; /^<!--.*-->$/d' > build/release-notes.md \
            && grep -q '^\* ' build/release-notes.md \
            && gh api markdown -F text=@build/release-notes.md -f mode=gfm -f context="$GITHUB_REPOSITORY" > build/release-notes.html \
            || rm -f build/release-notes.html
          ./scripts/make-appcast.sh
      # Only with the appcast: a release without it could never update itself.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release-tag }}
        run: gh release create "$TAG" build/Unplug-*.dmg build/appcast.xml --target "$GITHUB_SHA" --title "Unplug $TAG" --generate-notes
