<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf3"/>
      <stop offset="1" stop-color="#aab3c0"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px squircle-ish tile centered in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Monitor -->
  <g filter="url(#shadow)">
    <rect x="232" y="212" width="560" height="350" rx="34" fill="url(#bezel)"/>
    <rect x="258" y="238" width="508" height="298" rx="16" fill="url(#screen)"/>
    <path d="M466 562 h92 l12 46 h-116 z" fill="#aab3c0"/>
    <rect x="414" y="604" width="196" height="18" rx="9" fill="#c9d0da"/>
  </g>
  <path d="M258 254 a16 16 0 0 1 16 -16 h170 l-116 298 h-54 a16 16 0 0 1 -16 -16 z" fill="#ffffff" opacity="0.05"/>

  <!-- Display cable: from the monitor down to a socket end -->
  <path d="M720 562 C720 650, 720 744, 640 744 L590 744" fill="none" stroke="#c9d0da" stroke-width="22" stroke-linecap="round"/>
  <rect x="540" y="712" width="66" height="64" rx="14" fill="#c9d0da" filter="url(#shadow)"/>
  <rect x="540" y="728" width="10" height="32" rx="3" fill="#7d8796"/>

  <!-- Detached plug, prongs facing the socket -->
  <path d="M300 744 L380 744" stroke="#ff9a42" stroke-width="22" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="370" y="706" width="92" height="76" rx="18" fill="url(#plug)"/>
    <rect x="460" y="722" width="38" height="12" rx="4" fill="#ffd9a8"/>
    <rect x="460" y="754" width="38" height="12" rx="4" fill="#ffd9a8"/>
  </g>

  <!-- Gap sparks -->
  <g stroke="#ffb347" stroke-width="10" stroke-linecap="round">
    <line x1="519" y1="680" x2="519" y2="700"/>
    <line x1="519" y1="788" x2="519" y2="808"/>
    <line x1="494" y1="690" x2="502" y2="702"/>
    <line x1="544" y1="690" x2="536" y2="702"/>
  </g>
</svg>
